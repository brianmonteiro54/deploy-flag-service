apiVersion: apps/v1
kind: Deployment
metadata:
  name: flag-service
  namespace: togglemaster-flag
  labels:
    app.kubernetes.io/name: flag-service
    app.kubernetes.io/component: flag
    app.kubernetes.io/part-of: togglemaster
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flag-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: flag-service
        app.kubernetes.io/name: flag-service
        app.kubernetes.io/component: flag
        app.kubernetes.io/part-of: togglemaster
    spec:
      initContainers:
        - name: build-database-url
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            - |
              python3 << 'EOF'
              import urllib.parse
              import os

              user = os.environ.get('DB_USER', '')
              password = os.environ.get('DB_PASSWORD', '')
              host = os.environ.get('DB_HOST', '')
              port = os.environ.get('DB_PORT', '5432')
              dbname = os.environ.get('DB_NAME', '')

              encoded_user = urllib.parse.quote(user, safe='')
              encoded_password = urllib.parse.quote(password, safe='')

              database_url = f"postgres://{encoded_user}:{encoded_password}@{host}:{port}/{dbname}?sslmode=require"

              with open('/shared/DATABASE_URL', 'w') as f:
                  f.write(database_url)
              EOF
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: flag-service-config
                  key: FLAG_DB_HOST
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: flag-service-config
                  key: FLAG_DB_PORT
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: flag-service-config
                  key: FLAG_DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: flag-service-rds
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: flag-service-rds
                  key: password
          volumeMounts:
            - name: shared-data
              mountPath: /shared

      containers:
        - name: flag-service
          image: 420414435435.dkr.ecr.us-east-1.amazonaws.com/togglemaster/flag-service:6abb71c865cefa0046247a882fe1867fed3140e4
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            - |
              export DATABASE_URL=$(cat /shared/DATABASE_URL)
              exec ./flag-service
          ports:
            - name: http
              containerPort: 8002
          env:
            - name: PORT
              value: "8002"
            - name: APP_ENV
              value: "production"
            - name: AUTH_SERVICE_URL
              valueFrom:
                secretKeyRef:
                  name: flag-service-config
                  key: AUTH_SERVICE_URL
          volumeMounts:
            - name: shared-data
              mountPath: /shared
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi

      volumes:
        - name: shared-data
          emptyDir: {}